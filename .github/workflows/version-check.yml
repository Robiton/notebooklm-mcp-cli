name: Version Alignment Check

on:
  push:
    branches: [main, enterprise-url-support]
    paths:
      - 'pyproject.toml'
      - 'src/notebooklm_tools/__init__.py'
      - 'src/notebooklm_tools/data/SKILL.md'
      - 'version'
      - 'uv.lock'
      - 'src/notebooklm_tools/data/AGENTS_SECTION.md'
      - 'desktop-extension/manifest.json'
  pull_request:
    branches: [main, enterprise-url-support]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check-versions:
    name: Verify version alignment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extract and compare versions
        run: |
          set -euo pipefail

          # Extract version from pyproject.toml
          TOML_VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')

          # Extract version from __init__.py
          INIT_VERSION=$(grep '^__version__' src/notebooklm_tools/__init__.py | head -1 | sed 's/__version__ = "\(.*\)"/\1/')

          # Extract version from SKILL.md (YAML frontmatter)
          SKILL_VERSION=$(grep '^version:' src/notebooklm_tools/data/SKILL.md | head -1 | sed 's/version: "\(.*\)"/\1/')

          # Extract version from root version file (strip optional timestamp suffix YYYYMMDD.HHMM)
          FILE_VERSION=$(cat version | tr -d '[:space:]' | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')

          echo "📦 pyproject.toml:  $TOML_VERSION"
          echo "🐍 __init__.py:     $INIT_VERSION"
          echo "🤖 SKILL.md:        $SKILL_VERSION"
          # Extract version from AGENTS_SECTION.md marker and the desktop extension manifest
          AGENTS_VERSION=$(grep 'nlm-version:' src/notebooklm_tools/data/AGENTS_SECTION.md | head -1 | sed 's/.*nlm-version: \(.*\) -->/\1/')
          MANIFEST_VERSION=$(grep '"version"' desktop-extension/manifest.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')

          # Extract this project's own entry from uv.lock (the line after its name)
          LOCK_VERSION=$(grep -A1 '^name = "notebooklm-enterprise-mcp"$' uv.lock | sed -n 's/^version = "\(.*\)"/\1/p')

          echo "📄 version file:    $FILE_VERSION"
          echo "🔒 uv.lock:         $LOCK_VERSION"
          echo "📝 AGENTS_SECTION:  $AGENTS_VERSION"
          echo "🧩 manifest.json:   $MANIFEST_VERSION"

          FAILED=0

          if [ "$TOML_VERSION" != "$INIT_VERSION" ]; then
            echo ""
            echo "❌ MISMATCH: pyproject.toml ($TOML_VERSION) ≠ __init__.py ($INIT_VERSION)"
            FAILED=1
          fi

          if [ "$TOML_VERSION" != "$SKILL_VERSION" ]; then
            echo ""
            echo "❌ MISMATCH: pyproject.toml ($TOML_VERSION) ≠ SKILL.md ($SKILL_VERSION)"
            FAILED=1
          fi

          if [ "$TOML_VERSION" != "$FILE_VERSION" ]; then
            echo ""
            echo "❌ MISMATCH: pyproject.toml ($TOML_VERSION) ≠ version file ($FILE_VERSION)"
            FAILED=1
          fi

          if [ "$TOML_VERSION" != "$LOCK_VERSION" ]; then
            echo ""
            echo "❌ MISMATCH: pyproject.toml ($TOML_VERSION) ≠ uv.lock ($LOCK_VERSION) — run 'uv lock'"
            FAILED=1
          fi

          if [ "$TOML_VERSION" != "$AGENTS_VERSION" ]; then
            echo ""
            echo "❌ MISMATCH: pyproject.toml ($TOML_VERSION) ≠ AGENTS_SECTION.md ($AGENTS_VERSION)"
            FAILED=1
          fi

          if [ "$TOML_VERSION" != "$MANIFEST_VERSION" ]; then
            echo ""
            echo "❌ MISMATCH: pyproject.toml ($TOML_VERSION) ≠ manifest.json ($MANIFEST_VERSION)"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "🛑 Version alignment check FAILED."
            echo "   All seven files must declare the same version before releasing."
            echo ""
            echo "   Files to update:"
            echo "     - pyproject.toml                      → version = \"X.Y.Z\""
            echo "     - src/notebooklm_tools/__init__.py    → __version__ = \"X.Y.Z\""
            echo "     - src/notebooklm_tools/data/SKILL.md  → version: \"X.Y.Z\""
            echo "     - version                             → X.Y.Z"
            echo "     - uv.lock                             → run 'uv lock'"
            echo "     - src/notebooklm_tools/data/AGENTS_SECTION.md → <!-- nlm-version: X.Y.Z -->"
            echo "     - desktop-extension/manifest.json     → \"version\": \"X.Y.Z\""
            exit 1
          fi

          echo ""
          echo "✅ All versions aligned at $TOML_VERSION"
