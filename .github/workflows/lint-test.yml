name: Lint, Format, and Test

on:
  push:
    branches: [main, enterprise-url-support]
  pull_request:
    branches: [main, enterprise-url-support]

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint and format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Run ruff linting
        run: uv run --extra dev ruff check . --output-format=github

      - name: Run ruff format check
        run: uv run --extra dev ruff format --check .

  test:
    name: Run tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Run tests with pytest
        run: uv run --extra dev --with pytest-github-actions-annotate-failures pytest -v --tb=short -m "not e2e"

  # Fork: the main ruleset requires a check named "Run tests". Upstream's OS matrix renamed
  # the job per leg, so this gate reports that name and passes only if every leg passed.
  tests-complete:
    name: Run tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every test leg to pass
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "test matrix result: $RESULT"
          test "$RESULT" = "success"
