name: Lint, Format, and Test

on:
  push:
    branches: [main, enterprise-url-support]
  pull_request:
    branches: [main, enterprise-url-support]

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint and format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Run ruff linting
        run: uv run --extra dev ruff check . --output-format=github

      - name: Run ruff format check
        run: uv run --extra dev ruff format --check .

  # Fork: Linux only. Upstream added a Windows leg in v0.15.4; the fork targets a hosted
  # MCP server (not end-user devices) and is developed on macOS, so it was dropped.
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Run tests with pytest
        run: uv run --extra dev --with pytest-github-actions-annotate-failures pytest -v --tb=short -m "not e2e"

